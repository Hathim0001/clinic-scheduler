server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path the server does not know is handled by the router in the browser.
    location / {
        try_files $uri /index.html;
        # Same protections as vercel.json (HSTS is left to the TLS terminator in front); they sit
        # here because add_header in a location replaces any set at server level.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8000; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }
}
