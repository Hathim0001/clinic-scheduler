# Render blueprint for the API. The database is Neon (free) and the UI is on Vercel (free).
services:
  - type: web
    name: clinic-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets and per-environment values are entered in the Render dashboard (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TEST_CLOCK_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Sign-in is required. Set these in the dashboard: a long random AUTH_SECRET and the first
      # administrator (created once, only if no account exists). For a public demo only, set
      # ALLOW_OPEN_ACCESS=true and leave AUTH_SECRET unset (a secret always turns sign-in on);
      # the app then says on every page that sign-in is off.
      - key: AUTH_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # One proxy (Render's load balancer) appends the client address to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
