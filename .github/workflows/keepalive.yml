name: keepalive

# Render's free plan puts the API to sleep after about 15 minutes without traffic, and the next
# request then waits about a minute. This pings /healthz (which never touches the database, so
# Neon's free compute can still suspend) every 10 minutes so a reviewer does not meet the cold start.
# It is a convenience, not part of the application: delete it if the API moves to an always-on plan.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://clinic-api-pn9t.onrender.com/healthz
