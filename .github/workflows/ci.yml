name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@localhost:5432/clinic_test
      TEST_DATABASE_URL: postgresql+psycopg://clinic:clinic@localhost:5432/clinic_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint, format and types
        run: ruff check . && ruff format --check . && mypy
      - name: Migrations go up, down and up again
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests with coverage (the rules layer must stay at 80 percent or more)
        run: python scripts/run_tests.py
      - name: Dependency audit (informational)
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test -- --run && npm run build
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait
      - name: The API and the UI answer
        run: |
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8000/api/v1/doctors
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
      - name: Twenty simultaneous bookings of one slot give exactly one booking
        run: python backend/scripts/burst.py --base-url http://localhost:8000 --requests 20
      - if: failure()
        run: docker compose logs --no-color --tail 200

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
