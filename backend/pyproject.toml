# Tool configuration only. Dependencies are pinned in requirements.txt and requirements-dev.txt.
[project]
name = "clinic-scheduler-backend"
version = "0.1.0"
description = "Clinic appointment scheduler API (KJBN Labs take-home, Problem 2)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (S608 flags string-built SQL),
# SIM simplify, C4 comprehensions, PT pytest style, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["app", "scripts", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# The rules layer is held to the strictest settings: it is the part reviewers read first.
[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests that need no database",
    "integration: tests that need PostgreSQL",
    "concurrency: multi-connection race tests (need PostgreSQL)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]
