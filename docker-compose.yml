name: clinic-scheduler

# The whole stack:  docker compose up --build
#   UI   http://localhost:8080      API  http://localhost:8000/docs      database  localhost:5433
# For development only the database is needed:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    # Host port 5433 (not 5432) avoids clashing with a PostgreSQL installed on the host.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      TEST_CLOCK_ENABLED: "true"
      LOG_LEVEL: INFO
      # 0 switches the per-address limit off, for fuzzing; the default keeps the real limit.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      # Staff sign-in is required by the application. This stack is for a laptop, so it is switched
      # off here on purpose (and the app says so on every page). To try sign-in and the roles:
      #   ALLOW_OPEN_ACCESS=false AUTH_SECRET=<16+ random characters> \
      #   BOOTSTRAP_ADMIN_USERNAME=admin BOOTSTRAP_ADMIN_PASSWORD=<8+ characters> \
      #   SEED_DEMO_ACCOUNTS=true DEMO_ACCOUNTS_PASSWORD=<8+ characters> docker compose up --build
      ALLOW_OPEN_ACCESS: ${ALLOW_OPEN_ACCESS:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-}
      DEMO_ACCOUNTS_PASSWORD: ${DEMO_ACCOUNTS_PASSWORD:-}
      # Optional: a single shared staff password (8+ characters).
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      # Optional: where messages to patients go. Unset, they wait on the Messages page.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-sms}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser, not the container, calls the API, so this is the address of the host port.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports: ["8080:80"]

volumes:
  pgdata:
